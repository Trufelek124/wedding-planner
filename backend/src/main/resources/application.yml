# Every value that differs between installations comes from an environment variable.
# The variables are listed in docs/deployment.md.
spring:
  application:
    name: wedding-planner
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Give up on the database after 5 s instead of the default 30 s, so that the health
      # endpoint answers "down" before a container health check times out.
      connection-timeout: 5000
      validation-timeout: 2000
  servlet:
    multipart:
      # One picture, and one request with several of them. The web app checks the same before it sends.
      max-file-size: 15MB
      max-request-size: 100MB
      # Uploads wait on the media volume while they arrive, not in /tmp, which is memory in the container.
      location: ${APP_MEDIA_DIR}/incoming
  task:
    scheduling:
      # The mail sync and the reading of the mail run on their own clocks. A round of reading can take minutes (the AI
      # service is slow), and the sync must not wait for it.
      pool:
        size: 2
  jackson:
    deserialization:
      # 1250.5 where a whole number belongs is refused, not cut down to 1250: money is whole numbers of
      # the currency's smallest unit, and a client that sends a fraction has a mistake to hear about.
      accept-float-as-int: false
  mvc:
    problemdetails:
      # Errors are answered as RFC 9457 problem details (see the api module).
      enabled: true

app:
  # Directory with the built web app; empty means the backend serves the API only.
  web-dir: ${APP_WEB_DIR:}
  # Directory for the files that are kept: the pictures of inspirations. The server does not start without it.
  media-dir: ${APP_MEDIA_DIR}
  previews:
    # For a saved link the server fetches the page's title and preview picture from the public internet.
    # false: it never goes out for that; links are kept without a preview.
    automatic: ${PREVIEWS_ENABLED:true}
    # How often it looks for links still to be fetched, besides right after one is saved.
    poll-interval: 30s
  identity:
    # Signs the access tokens. At least 32 characters; changing it signs everyone out.
    jwt-secret: ${APP_JWT_SECRET}
    # The Google OAuth client the web and Android apps sign in with. Empty: nobody can sign in with Google.
    google-client-id: ${GOOGLE_OAUTH_WEB_CLIENT_ID:}
    # Comma-separated addresses that may sign in. Empty: nobody may.
    allowed-emails: ${ALLOWED_EMAILS:}
    # Signing in as an allowed address without Google. For development and tests only.
    dev-login-enabled: ${DEV_LOGIN_ENABLED:false}
    google-jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    access-token-ttl: 15m
    refresh-token-ttl: 60d

  mail:
    # The e-mail import (S03). It is on only when all four settings of the first block are given and valid;
    # otherwise the server starts as before and asks nothing of Google. A secret is never logged or answered.
    google-client-id: ${GOOGLE_OAUTH_WEB_CLIENT_ID:}
    google-client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    # The planner's own address as people reach it: https, or http://localhost for a developer's machine.
    public-url: ${APP_PUBLIC_URL:}
    # 32 random bytes, base64: the key the mailbox tokens are encrypted with. Not in the database.
    token-key: ${APP_MAIL_TOKEN_KEY:}
    # Google's own addresses. Settings only so that tests can point them at a stand-in.
    authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    revoke-uri: https://oauth2.googleapis.com/revoke
    gmail-uri: https://gmail.googleapis.com
    # How long one call to Google, answer included, may take.
    google-timeout: 10s
    # How often the server looks at the connected mailboxes (S03 section 5), counted from the end of the last look.
    sync-interval: ${MAIL_SYNC_INTERVAL:5m}
    # false: the server never looks by itself (tests call the look themselves). Nothing runs while the import is off.
    sync-automatic: ${MAIL_SYNC_ENABLED:true}

  reading:
    # Reading the mail with the AI service (S04, D-007). It is on only when a key is given and the rest is valid;
    # otherwise the server starts as before, makes no client of the service and asks it nothing. The key is a secret
    # like the others: never in the repository, a response or the log.
    api-key: ${APP_AI_API_KEY:}
    # Empty: the SDK's own address. Settable for tests, which point it at a stand-in; the key goes to this address.
    base-url:
    # The models, written exactly so and never with a date added.
    triage-model: ${APP_AI_TRIAGE_MODEL:claude-haiku-5-5}
    extraction-model: ${APP_AI_EXTRACTION_MODEL:claude-opus-5-5}
    # How long one call, answer included, may take. Extraction thinks before it writes.
    request-timeout: 5m
    # The round (S04 section 2): how often the server reads what waits, counted from the end of the last round.
    interval: ${MAIL_READING_INTERVAL:1m}
    # false: the server never reads by itself (tests call the round themselves). Nothing runs while the reading is off.
    automatic: ${MAIL_READING_ENABLED:true}
    # How many messages one round takes at most, the newest first.
    batch: 20
    # A "no, this is not about the wedding" that is less sure than this (0 to 100) is read on as if it were a "yes":
    # missing a message about the wedding is worse than paying for one extraction that proposes nothing.
    triage-sure: ${MAIL_READING_TRIAGE_SURE:60}
    # The brakes (S04 section 8). The estimate of the month in US dollars; when it reaches this, the reading pauses until
    # the next month. Days and months are UTC.
    monthly-limit-usd: ${MAIL_READING_MONTHLY_LIMIT_USD:20}
    # How many messages are triaged in a day; when reached, the reading pauses until tomorrow.
    daily-messages: ${MAIL_READING_DAILY_MESSAGES:2000}
    # How many new suggestions one mailbox may bring in a day; when reached, that mailbox waits until tomorrow.
    daily-suggestions-per-mailbox: ${MAIL_READING_DAILY_SUGGESTIONS:50}
    # What the estimate of the cost is worked out from: US dollars per million tokens, by step. A model that answers
    # and is not the one named above (the service's own fallback) is counted at the price of the step that asked.
    triage-price-in: ${APP_AI_TRIAGE_PRICE_IN:0.10}
    triage-price-out: ${APP_AI_TRIAGE_PRICE_OUT:0.50}
    extraction-price-in: ${APP_AI_EXTRACTION_PRICE_IN:4}
    extraction-price-out: ${APP_AI_EXTRACTION_PRICE_OUT:20}

server:
  port: 8080
  # The app runs behind a proxy that terminates TLS.
  forward-headers-strategy: framework

# The API description (/v3/api-docs) is for building the clients; production does not serve it.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match: /api/**

logging:
  level:
    # These two write whole request and response bodies at DEBUG. They stay at INFO even when
    # someone turns debug logging on for the rest of the web layer: bodies hold personal data.
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO
    # The embedded server prints the request line, query included, at DEBUG. The mail connection's return address
    # arrives with Google's code and the ticket's state in its query: these stay at INFO whatever the rest is set to.
    org.apache.coyote.http11.Http11InputBuffer: INFO
    org.apache.tomcat.util.http.Parameters: INFO
    # ... and the cookies, which at DEBUG are printed as they were sent (the sign-in's and the mail connection's).
    org.apache.tomcat.util.http.Rfc6265CookieProcessor: INFO
    org.apache.tomcat.util.http.parser.Cookie: INFO
    # At TRACE the SQL layer prints the value of every statement parameter: addresses, names, hashes.
    org.springframework.jdbc.core.StatementCreatorUtils: INFO
    # The AI service's SDK and its HTTP client can print the requests and answers they carry: a message's words, and the
    # key. They stay at INFO whatever the rest is set to, and the SDK's own logging is not switched on.
    com.anthropic: INFO
    okhttp3: INFO
    okio: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
