# Every commit that reaches main becomes an image, and the server takes the newest image by itself
# (docs/decisions.md, D-010). So: what is pushed to main goes live, with nobody in between.
#
# This repository is public. What keeps the workflow tight:
#   - it runs for pushes to main and when the owner starts it by hand, never for a pull request;
#   - it holds no secret: the registry takes the run's own short-lived token;
#   - only the job that pushes may write packages, and only for main;
#   - the three actions it uses are GitHub's own, named by commit and not by a tag that can move;
#     the image is built and pushed with plain docker commands.
name: Publish the image

on:
  push:
    branches: [main]
    # A push that changes nothing the image is made of makes no new image, so the server is not
    # restarted for a document or for the phone app.
    paths-ignore:
      - 'docs/**'
      - 'android/**'
      - 'scripts/ops/**'
      - '**/*.md'
  workflow_dispatch:

# One at a time. A newer push waits for the run before it; an older one that still waits gives way.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: The checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          # What the build downloads is kept from run to run: Maven Central now and then answers a
          # machine of GitHub's with "too many requests", and a run that asks for nothing is not refused.
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle.kts
            backend/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The same checks the publishing script runs: the two parts the image is built from.
      - name: The gate, for the backend and the web app
        run: scripts/gate.sh backend web

  image:
    name: The image
    needs: checks
    # Only main is ever published, also when the workflow is started by hand from another branch.
    if: github.ref == 'refs/heads/main'
    # The server's processor is ARM: built on a machine of that kind, nothing is emulated.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build for linux/arm64
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # The layers that hold what the build downloads (npm's packages, Gradle's libraries) are kept in
          # the registry under a tag of their own, so that a build whose dependencies did not change asks
          # neither npm nor Maven Central for anything.
          docker buildx create --name publisher --use >/dev/null
          docker buildx build \
            --platform linux/arm64 \
            --build-arg "REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --cache-from "type=registry,ref=$image:build-cache" \
            --cache-to "type=registry,ref=$image:build-cache,mode=max" \
            --tag "$image:$GITHUB_SHA" \
            --tag "$image:latest" \
            --load \
            .
          # Never push an image that does not say which commit it is, or that is for another machine.
          labelled=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image:$GITHUB_SHA")
          [ "$labelled" = "$GITHUB_SHA" ] || { echo "The image says it is commit \"$labelled\", not $GITHUB_SHA." >&2; exit 1; }
          built_for=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image:$GITHUB_SHA")
          [ "$built_for" = "linux/arm64" ] || { echo "The image is for $built_for, not for linux/arm64." >&2; exit 1; }
          echo "image=$image" >> "$GITHUB_ENV"
      - name: Push, under the commit and as latest
        run: |
          set -euo pipefail
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
          docker logout ghcr.io
          echo "Published $image:$GITHUB_SHA and $image:latest" >> "$GITHUB_STEP_SUMMARY"
